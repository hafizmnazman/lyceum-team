# Deploys the frontend (web/) to Vercel production, only when the repository owner starts it by hand:
# Actions > "Deploy web (Vercel)" > Run workflow (branch: main). Pushes, pull requests and merges never trigger it.
#
# The run gates deployment in this order:
#   1. The Checks workflow (checks.yml: typecheck and every prove suite) passed for this exact commit.
#   2. The Database (Supabase) workflow migrated successfully for this exact commit (database.yml runs on every push to main).
#   3. The production environment's approval, if one is set, then the deploy.
#
# Why nobody else can deploy:
# - The jobs run only if the owner both started the run and (for a re-run) clicked re-run, and only on main.
# - The Vercel secrets live in the "production" GitHub Environment, which only main may use.
# Setup, once: GitHub > Settings > Environments > production, secrets VERCEL_TOKEN (vercel.com/account/tokens),
# VERCEL_ORG_ID and VERCEL_PROJECT_ID (orgId and projectId in .vercel/project.json after `vercel link`). The page's own
# settings (VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY) live in Vercel's Production environment, which vercel pull reads.
name: Deploy web (Vercel)

on:
  workflow_dispatch:

# One deployment at a time; a second click waits for the first to finish
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-checks:
    name: Verify checks
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    steps:
      - name: Require successful checks for this commit
        run: |
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow checks.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "Checks have not passed for commit $GITHUB_SHA (result: ${conclusion:-not found})." >&2
            echo "Push the commit to main, wait for Checks to finish, then run this workflow again." >&2
            exit 1
          fi
          echo "Checks passed for commit $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}

  verify-database:
    name: Verify database migration
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    steps:
      - name: Require a successful migration for this commit
        run: |
          # database.yml names its runs "Database <action> for <sha>"; a push to main runs "migrate"
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow database.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 20 \
            --json conclusion,displayTitle \
            --jq '[.[] | select(.displayTitle | startswith("Database migrate")) | .conclusion] | .[0] // empty')
          if [ "$conclusion" != "success" ]; then
            echo "A successful database migration for commit $GITHUB_SHA was not found (result: ${conclusion:-not found})." >&2
            echo "Run Database (Supabase) with action=migrate, wait for it to pass, then run this workflow again." >&2
            exit 1
          fi
          echo "Database migration passed for commit $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to Vercel
    needs: [verify-checks, verify-database]
    runs-on: ubuntu-latest
    environment:
      name: production # holds the secrets; only main may use it
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm install --global vercel@64.7.0
      # The Vercel project's Root Directory is the repo root; vercel.json there sets npm install, npm run build, dist/
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to production: $url" >> "$GITHUB_STEP_SUMMARY"
