<!doctype html>
<html><head><meta charset="utf-8"><title>Lyceum architecture</title>
<style>
  body { margin: 0; background: #ffffff; font-family: "Segoe UI", Arial, sans-serif; }
  svg { display: block; }
  .box { fill: #f6f7f9; stroke: #1f2937; stroke-width: 2; rx: 12; }
  .core { fill: #eef6f0; stroke: #1f6f3f; stroke-width: 2; rx: 12; }
  .ext { fill: #fff8ea; stroke: #8a5a00; stroke-width: 2; rx: 12; }
  .next { fill: #ffffff; stroke: #4b5563; stroke-width: 2; stroke-dasharray: 8 6; rx: 12; }
  .t { font-size: 24px; font-weight: 600; fill: #111827; }
  .s { font-size: 18px; fill: #374151; }
  .label { font-size: 17px; fill: #4b5563; }
  .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#head); }
  .dashed { stroke: #6b7280; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#head); }
</style></head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker></defs>
  <text x="40" y="52" style="font-size:30px;font-weight:700;fill:#111827">Lyceum architecture, 9 October 2026</text>
  <text x="40" y="84" class="label">Solid: built and verified. Dashed: planned. No model key is needed for anything on the left.</text>

  <!-- Lecturer -->
  <rect x="40" y="130" width="220" height="90" class="box"/>
  <text x="150" y="168" text-anchor="middle" class="t">Lecturer</text>
  <text x="150" y="198" text-anchor="middle" class="s">keeps every decision</text>

  <!-- Workspace -->
  <rect x="320" y="110" width="560" height="150" class="box"/>
  <text x="600" y="148" text-anchor="middle" class="t">Browser workspace (React, TypeScript)</text>
  <text x="600" y="180" text-anchor="middle" class="s">Course Studio: Outcomes and topics, Evidence, Teaching plan, Assessment</text>
  <text x="600" y="206" text-anchor="middle" class="s">Research run, exact quotations, coverage mapping, meeting brief, Home inbox</text>
  <text x="600" y="232" text-anchor="middle" class="s">Browser-local store with validated JSON backups</text>
  <path d="M260,175 L318,175" class="arrow"/>

  <!-- Core -->
  <rect x="320" y="310" width="560" height="140" class="core"/>
  <text x="600" y="348" text-anchor="middle" class="t">Deterministic core</text>
  <text x="600" y="380" text-anchor="middle" class="s">citation validator, duplicate fingerprints, reviewed denominators,</text>
  <text x="600" y="406" text-anchor="middle" class="s">95% Wilson intervals, coverage stages, meeting brief with receipts</text>
  <text x="600" y="432" text-anchor="middle" class="s">149 automated checks, 4 browser runs, self-driving demo</text>
  <path d="M600,262 L600,306" class="arrow"/>

  <!-- Sample -->
  <rect x="40" y="310" width="220" height="140" class="ext"/>
  <text x="150" y="350" text-anchor="middle" class="t">Saved sample</text>
  <text x="150" y="382" text-anchor="middle" class="s">10 real postings</text>
  <text x="150" y="408" text-anchor="middle" class="s">retrieved 9 Oct 2026</text>
  <text x="150" y="434" text-anchor="middle" class="s">works offline</text>
  <path d="M262,380 L316,380" class="arrow"/>

  <!-- API -->
  <rect x="960" y="110" width="600" height="150" class="box"/>
  <text x="1260" y="148" text-anchor="middle" class="t">Local API (Hono on Node 24)</text>
  <text x="1260" y="180" text-anchor="middle" class="s">/api/collect: two permitted hosts only, one-hour cache,</text>
  <text x="1260" y="206" text-anchor="middle" class="s">rate limits, 15 MB cap, 20-second timeout, plain errors</text>
  <text x="1260" y="232" text-anchor="middle" class="s">/api/parse: xlsx, csv, pdf, pptx, docx. /api/agent: optional model stream</text>
  <path d="M882,185 L956,185" class="arrow"/>

  <!-- External sources -->
  <rect x="960" y="310" width="280" height="110" class="ext"/>
  <text x="1100" y="350" text-anchor="middle" class="t">Greenhouse Job Board API</text>
  <text x="1100" y="380" text-anchor="middle" class="s">public, keyless, on request</text>
  <text x="1100" y="404" text-anchor="middle" class="s">verified: Stripe, 727 postings</text>
  <rect x="1280" y="310" width="280" height="110" class="ext"/>
  <text x="1420" y="350" text-anchor="middle" class="t">Lever postings API</text>
  <text x="1420" y="380" text-anchor="middle" class="s">public, keyless, on request</text>
  <text x="1420" y="404" text-anchor="middle" class="s">verified: Palantir, 313 postings</text>
  <path d="M1100,262 L1100,306" class="arrow"/>
  <path d="M1420,262 L1420,306" class="arrow"/>

  <!-- Next -->
  <rect x="320" y="540" width="560" height="110" class="next"/>
  <text x="600" y="580" text-anchor="middle" class="t">Next: shared API and identity (W02)</text>
  <text x="600" y="612" text-anchor="middle" class="s">collect, list evidence, brief, send, record a decision; OpenAPI described</text>
  <text x="600" y="638" text-anchor="middle" class="s">server permissions, retention, audit, backups</text>
  <path d="M600,452 L600,536" class="dashed"/>

  <rect x="960" y="540" width="180" height="110" class="next"/>
  <text x="1050" y="585" text-anchor="middle" class="t">Teams</text>
  <text x="1050" y="615" text-anchor="middle" class="s">Copilot Studio agent</text>
  <rect x="1170" y="540" width="180" height="110" class="next"/>
  <text x="1260" y="585" text-anchor="middle" class="t">Slack</text>
  <text x="1260" y="615" text-anchor="middle" class="s">app over the API</text>
  <rect x="1380" y="540" width="180" height="110" class="next"/>
  <text x="1470" y="585" text-anchor="middle" class="t">LMS</text>
  <text x="1470" y="615" text-anchor="middle" class="s">LTI 1.3 launch</text>
  <path d="M882,595 L956,595" class="dashed"/>
  <path d="M1140,595 L1166,595" class="dashed"/>
  <path d="M1350,595 L1376,595" class="dashed"/>

  <text x="40" y="720" class="label">Not built yet: page collectors for sites without an API, shared accounts, slide generation, scheduled refresh. Earlier synthetic screens (Trends, Index, Acceptance test, Closed loop) are labelled illustrative.</text>
  <text x="40" y="750" class="label">Pilot measures: task completion, citation fidelity, time to an accepted brief, review effort, repeat use.</text>
</svg>
</body></html>
